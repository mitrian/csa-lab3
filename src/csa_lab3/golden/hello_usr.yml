in_source: |
  .data
  msg: 'Hello, '
  ptr: 2

  .text
  lea msg
  st ptr
  loopp: ld #ptr
  outt 1
  ld ptr
  inc 
  st ptr
  ld #ptr
  cmp $0
  jz loop 
  jmp loopp
  loop: inpp 2
  cmp $0
  jz exit
  outt 1    
  jmp loop
  exit: hlt
in_stdin: |
  mitrian
out_stdout: |
  ============================================================
  Hello, mitrian

  instruction_counter:  108
