in_source: |-
  .data
  a: 0
  b: 1
  sum: 0
  limit: 4000000
  temp: 0

  .text
  loop: ld limit
  cmp a
  jn end          
  ld a
  mod $2
  cmp $0
  jz add_even
  jmp next
  add_even: ld a
  add sum
  st sum
  next: ld a
  add b
  st temp
  ld b
  st a
  ld temp
  st b
  jmp loop
  end: ld sum
  outt 0
  hlt
in_stdin: |-
  something
out_stdout: |
