in_source: |-
  .data
  msg: 'hello world'
  ptr: 0

  .text
  lea msg
  st ptr
  loop: ld #ptr
  outt 1
  ld ptr
  inc 
  st ptr
  ld #ptr
  cmp $0
  jz exit
  jmp loop
  exit: hlt
in_stdin: |-
  something
out_stdout: |
  hello world
  instruction_counter:  101
